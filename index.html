
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The personal website of Luke Shinn.">
  <title>Luke Shinn</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      max-width: 640px;
      padding: 48px 24px;
      text-align: center;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: -0.05em;
    }

    p {
      color: #94a3b8;
      font-size: 1.125rem;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 14px;
      border: 1px solid #334155;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world. 👋</h1>
    <p>I'm Luke Shinn. Welcome to my corner of the internet.</p>
    <span class="status">More coming soon.</span>
  </main>
</body>
</html>
