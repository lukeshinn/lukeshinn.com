<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The personal website of Luke Shinn.">
  <meta name="theme-color" content="#08090c">
  <title>Luke Shinn — Software Engineer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090c;
      --text: #eef1f6;
      --muted: #98a1b3;
      --faint: #6b7385;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #7c9cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 64px);
      background:
        radial-gradient(60% 50% at 12% 8%, rgba(124, 156, 255, 0.16), transparent 62%),
        radial-gradient(45% 45% at 92% 88%, rgba(94, 234, 212, 0.09), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      gap: clamp(32px, 6vw, 88px);
      align-items: center;
    }

    /* Portrait */
    .portrait {
      position: relative;
      justify-self: center;
      width: 100%;
      max-width: 420px;
      margin: 0;
      isolation: isolate;
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: -12%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 156, 255, 0.32), transparent 65%);
      filter: blur(48px);
      pointer-events: none;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 16px -16px -16px 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 34px;
      pointer-events: none;
    }

    .portrait img {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #12141a;
      box-shadow:
        0 40px 80px -32px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }

    /* Intro */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 clamp(20px, 3vw, 28px);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    h1 {
      margin: 0 0 clamp(16px, 2.5vw, 22px);
      font-size: clamp(2.6rem, 6vw, 4.25rem);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    p {
      max-width: 46ch;
      margin: 0 0 clamp(28px, 4vw, 36px);
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.125rem);
      line-height: 1.75;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      font-size: 0.82rem;
      letter-spacing: 0.01em;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 0 4px rgba(110, 231, 183, 0.12);
      animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 7px rgba(110, 231, 183, 0.06);
        opacity: 0.75;
      }
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: clamp(32px, 5vw, 48px);
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--line);
    }

    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        gap: clamp(36px, 9vw, 48px);
        overflow-x: clip;
      }

      .portrait {
        max-width: 300px;
      }

      .intro {
        align-items: center;
        text-align: center;
      }

      .eyebrow::before {
        display: none;
      }

      p {
        max-width: 42ch;
      }

      .meta {
        margin-top: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .status::before {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <figure class="portrait">
      <img
        src="headshot-color-1200.jpg"
        srcset="headshot-color-1200.jpg 1200w, headshot-color.jpg 3712w"
        sizes="(max-width: 820px) 300px, 420px"
        alt="Portrait of Luke Shinn"
        width="3712"
        height="3712"
        decoding="async"
        fetchpriority="high">
    </figure>

    <section class="intro">
      <p class="eyebrow">Software Engineer · Freelancer</p>
      <h1>Hello, world. 👋</h1>
      <p>I'm Luke Shinn. Welcome to my corner of the internet.</p>
      <span class="status">More coming soon.</span>
      <footer class="meta">© 2026 Luke Shinn</footer>
    </section>
  </main>
</body>
</html>
